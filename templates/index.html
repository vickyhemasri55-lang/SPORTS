<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ bot_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0a1410;
      --turf: #14532d;
      --turf-light: #1e7a44;
      --panel: #0f1f18;
      --panel-light: #16302a;
      --line: rgba(255, 255, 255, 0.14);
      --white: #f5f7f2;
      --muted: #9db3a6;
      --orange: #ff7a1a;
      --gold: #ffc93c;
      --red: #ff5d5d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Barlow", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--white);
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 60px, transparent 60px 120px),
        radial-gradient(ellipse at 50% 0%, #1b5e37 0, transparent 60%),
        var(--night);
    }

    .app {
      width: 100%;
      max-width: 860px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.15), 0 25px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .scoreboard {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--turf), #0d3b20);
      border-bottom: 3px solid var(--orange);
    }

    .ball {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--orange);
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: inset -4px -4px 8px rgba(0, 0, 0, 0.3);
      animation: spin 8s linear infinite;
    }

    .scoreboard h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 34px;
      letter-spacing: 3px;
      line-height: 1;
    }

    .scoreboard p {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .clear-btn {
      margin-left: auto;
      background: rgba(0, 0, 0, 0.3);
      color: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover { background: var(--orange); border-color: var(--orange); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: var(--panel-light); border-radius: 8px; }

    .row { display: flex; flex-direction: column; gap: 5px; animation: rise 0.25s ease; }
    .row.user { align-items: flex-end; }

    .tag {
      font-family: "Bebas Neue", sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .row.bot .tag { color: var(--gold); }
    .row.user .tag { color: var(--orange); }

    .bubble {
      max-width: 85%;
      padding: 13px 17px;
      line-height: 1.6;
      font-size: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .row.bot .bubble {
      background: var(--panel-light);
      border: 1px solid var(--line);
      border-left: 5px solid var(--gold);
      border-radius: 4px 16px 16px 16px;
    }

    .row.user .bubble {
      background: linear-gradient(135deg, var(--orange), #ff5a00);
      color: #1c0d02;
      font-weight: 600;
      border-radius: 16px 4px 16px 16px;
    }

    .row.error .bubble {
      border-left-color: var(--red);
      color: var(--red);
    }

    .typing {
      display: flex;
      gap: 6px;
      padding: 16px 18px;
    }

    .typing span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    .input-area {
      display: flex;
      gap: 12px;
      padding: 16px 24px 20px;
      background: var(--night);
      border-top: 1px solid var(--line);
    }

    #input {
      flex: 1;
      resize: none;
      max-height: 120px;
      padding: 13px 18px;
      background: var(--panel-light);
      color: var(--white);
      border: 2px solid transparent;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    #input::placeholder { color: var(--muted); }
    #input:focus { border-color: var(--orange); }

    #send {
      padding: 0 24px;
      border: none;
      border-radius: 14px;
      background: var(--gold);
      color: #2b2000;
      font-family: "Bebas Neue", sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #send:hover { transform: translateY(-2px); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-7px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; border: none; }
      .bubble { max-width: 94%; }
      .scoreboard p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="scoreboard">
      <div class="ball">🏆</div>
      <div>
        <h1>{{ bot_name }}</h1>
        <p>Study Arena</p>
      </div>
      <button class="clear-btn" id="clear">New Match</button>
    </header>

    <div id="messages"></div>

    <div class="input-area">
      <textarea id="input" rows="1" placeholder="Ask a sports study question..."></textarea>
      <button id="send">SEND</button>
    </div>
  </div>

  <script>
    const botName = {{ bot_name | tojson }};
    const welcome = {{ welcome | tojson }};
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");

    let history = [];

    function addMessage(text, type) {
      const row = document.createElement("div");
      row.className = "row " + type;

      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = type === "user" ? "YOU" : botName;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(tag);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "row bot";
      row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await response.json();
        typing.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot error");
        }
      } catch (error) {
        typing.remove();
        addMessage("Network error. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage(welcome, "bot");
    }

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", resetChat);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    resetChat();
  </script>
</body>
</html>
